name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: |
          cd bot
          npm ci --production

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 31.56.189.105
          username: root
          key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHLDXTm5ZVsiklscAFSkdG43fVm2lhgXofxYxBI/2pWM my-server
          port: 22
          script: |
            set -e
            cd /opt/max-bot
            git pull origin main
            cd bot
            npm ci --production
            pm2 reload max-bot || pm2 start src/index.js --name max-bot
            pm2 save
